<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zapier.sh</title>
  <meta name="description" content="zapier.sh is coming soon.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ff4f00'/%3E%3C/svg%3E">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #201515;
      color: #fffdf9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main { padding: 2rem; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); font-weight: 600; }
    .prompt { color: #ff4f00; }
    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      margin-left: 0.15em;
      vertical-align: -0.1em;
      background: #ff4f00;
      animation: blink 1s steps(1) infinite;
    }
    p { margin: 1rem 0 0; font-size: 1.1rem; opacity: 0.75; }
    a { color: inherit; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1><span class="prompt">$</span> zapier.sh<span class="cursor"></span></h1>
    <p>Coming soon. From <a href="https://zapier.com">Zapier</a>.</p>
  </main>
</body>
</html>
